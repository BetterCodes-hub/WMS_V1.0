name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wms
          POSTGRES_PASSWORD: wms
          POSTGRES_DB: wms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wms"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://wms:wms@localhost:5432/wms_test?schema=public
      TEST_DATABASE_URL: postgresql://wms:wms@localhost:5432/wms_test?schema=public
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migracje bazy
        run: pnpm --filter api exec prisma migrate deploy
      - name: Typecheck
        run: pnpm lint
      - name: Testy jednostkowe
        run: pnpm --filter api test
      - name: Testy e2e (PostgreSQL)
        run: pnpm --filter api test:e2e
      - name: Build
        run: pnpm build
